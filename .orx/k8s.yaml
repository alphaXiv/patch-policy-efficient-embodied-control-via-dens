apiVersion: batch/v1
kind: Job
metadata:
  name: patch-policy-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_HOME
              value: /tmp/huggingface
            - name: TORCH_HOME
              value: /tmp/torch
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "32"
              memory: 128Gi
            limits:
              nvidia.com/gpu: "8"
              cpu: "64"
              memory: 256Gi
